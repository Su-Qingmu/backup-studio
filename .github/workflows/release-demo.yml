name: Windows Demo Release

on:
  # ==== 临时停用自动触发（PR #16 审查期间）====
  # 恢复方式：删除本段注释与 workflow_dispatch，并还原下面两行触发器配置。
  # push:
  #   tags: ['v0.1demo']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Package Windows x64 installer
        run: npx --no-install electron-builder --win nsis --x64 --publish never '-c.artifactName=v0.1demo.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-demo
          path: release/v0.1demo.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v0.1demo') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-demo
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Backup Studio v0.1 Demo
          draft: false
          prerelease: true
          make_latest: 'false'
          files: artifacts/v0.1demo.exe
          fail_on_unmatched_files: true
